<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Details - Caprican Bills Archive</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bill-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .bill-detail-panel {
            padding: 3rem;
            width: 100%;
            margin: 0 auto;
        }
        .bill-detail-panel h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 1rem;
            line-height: 1.4;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .bill-detail-panel .date {
            color: var(--text-muted);
            margin-bottom: 2rem;
            display: block;
        }
        .bill-detail-panel .meta {
            margin-bottom: 2rem;
        }
        .bill-detail-panel .section {
            margin-top: 2rem;
        }
        .bill-detail-panel .section p {
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .doc-button {
            display: inline-block;
            background-color: var(--accent);
            color: #000;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0;
            margin-top: 1rem;
            transition: background-color 0.2s, transform 0.1s;
        }
        .doc-button:hover {
            background-color: #3b82f6;
            text-decoration: none;
            color: #000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="bill-container">
        <a href="index.html" class="back-link">← Back to Archive</a>
        
        <div class="flat-panel bill-detail-panel" id="billContent">
            <div class="loader">Loading bill details...</div>
        </div>
    </div>

    <script>
        async function loadBill() {
            const urlParams = new URLSearchParams(window.location.search);
            const billId = parseInt(urlParams.get('id'));
            
            if (!billId) {
                document.getElementById('billContent').innerHTML = `<div class="error">Invalid bill ID.</div>`;
                return;
            }
            
            try {
                const response = await fetch('bills.json');
                const bills = await response.json();
                
                const bill = bills.find(b => b.id === billId);
                
                if (!bill) {
                    document.getElementById('billContent').innerHTML = `<div class="error">Bill not found.</div>`;
                    return;
                }
                
                document.title = `${bill.title} - Caprican Bills Archive`;
                
                let docLinkHtml = '';
                if (bill.doc_link && bill.doc_link !== 'No Link') {
                    docLinkHtml = `<a href="${bill.doc_link}" target="_blank" class="doc-button">View Full Document ↗</a>`;
                }
                
                document.getElementById('billContent').innerHTML = `
                    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                        <h1 style="margin-bottom: 0;">\${bill.title}</h1>
                        \${bill.category ? \`<span style="background-color: var(--accent); color: #000; padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase;">\${bill.category}</span>\` : ''}
                    </div>
                    <span class="date">\${bill.date || 'Unknown Date'}</span>
                    
                    <div class="meta">
                        <span class="proposer">By: ${bill.proposer || 'Unknown'}</span>
                        ${docLinkHtml}
                    </div>
                    
                    <div class="section main-goal">
                        <h3>Main Goal</h3>
                        <p>${bill.main_goal || 'Not specified'}</p>
                    </div>
                    
                    ${bill.votes_yay !== null && bill.votes_yay !== undefined ? \`
                    <div class="section votes">
                        <h3>Vote Results</h3>
                        <div style="display: flex; gap: 2rem; margin-top: 1rem; flex-wrap: wrap;">
                            <div style="background-color: rgba(74, 222, 128, 0.1); border-left: 4px solid #4ade80; padding: 1rem 1.5rem; flex-grow: 1;">
                                <div style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #4ade80; margin-bottom: 0.5rem;">Yay</div>
                                <div style="font-size: 2rem; font-weight: 800; color: #fff;">\${bill.votes_yay}</div>
                            </div>
                            <div style="background-color: rgba(248, 113, 113, 0.1); border-left: 4px solid #f87171; padding: 1rem 1.5rem; flex-grow: 1;">
                                <div style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #f87171; margin-bottom: 0.5rem;">Nay</div>
                                <div style="font-size: 2rem; font-weight: 800; color: #fff;">\${bill.votes_nay}</div>
                            </div>
                            <div style="background-color: rgba(251, 191, 36, 0.1); border-left: 4px solid #fbbf24; padding: 1rem 1.5rem; flex-grow: 1;">
                                <div style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #fbbf24; margin-bottom: 0.5rem;">Abstain</div>
                                <div style="font-size: 2rem; font-weight: 800; color: #fff;">\${bill.votes_abstain}</div>
                            </div>
                            <div style="background-color: rgba(156, 163, 175, 0.1); border-left: 4px solid #9ca3af; padding: 1rem 1.5rem; flex-grow: 1;">
                                <div style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin-bottom: 0.5rem;">Absent</div>
                                <div style="font-size: 2rem; font-weight: 800; color: #fff;">\${bill.votes_absent}</div>
                            </div>
                        </div>
                    </div>
                    \` : \`
                    <div class="section votes">
                        <h3>Vote Results</h3>
                        <p style="color: var(--text-muted); font-style: italic;">No voting data available yet, or poll is still ongoing.</p>
                    </div>
                    \`}
                \`;
            } catch (error) {
                document.getElementById('billContent').innerHTML = `<div class="error">Failed to load bill data.</div>`;
                console.error('Error fetching bills:', error);
            }
        }
        
        loadBill();
    </script>
</body>
</html>
